services:
  hadoop:
    build: ./hadoop
    container_name: hadoop
    volumes:
      - ./data:/data/input:ro
      - ./mapreduce:/mapreduce
      - ./salida:/salida
      - sshkeys:/keys
    networks: [ datamart ]

  db:
    image: postgres:16
    container_name: db
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [ datamart ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      retries: 10

  api:
    build: ./api
    container_name: api
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./scripts:/scripts
      - ./salida:/salida
      - sshkeys:/keys:ro
    depends_on:
      db:
        condition: service_healthy
      hadoop:
        condition: service_started
    networks: [ datamart ]

networks:
  datamart:

volumes:
  pgdata:
  sshkeys:
